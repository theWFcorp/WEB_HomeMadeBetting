/* ===== HOMEMADE BETTING — design system ===== */
/* Тёмная спортивная «арена» по умолчанию; светлая тема — полноценная. */
:root{
  --blue:#2f7bff; --blue-2:#5aa0ff; --blue-deep:#123a86;
  --green:#12c26a; --green-2:#37e08c; --green-deep:#0b5f38;
  --gold:#ffcc3f; --gold-2:#ffe08a;
  --cyan:#37e0ff;
  --win:#25d07a; --lose:#ff5468; --live:#ff3b57;
  --accent:var(--cyan);

  /* тёмная (default) */
  --bg:#070b14; --bg-2:#0b1120; --arena:#0a1122;
  --surface:#111a2e; --surface-2:#16223c; --surface-3:#1d2c4c;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --text:#eaf0fb; --muted:#93a2c0; --faint:#6a7998;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75);
  --shadow-sm:0 6px 18px -8px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(55,224,255,.35);
  --radius:16px; --radius-sm:11px; --radius-lg:22px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#eef1f7; --bg-2:#e6ebf4; --arena:#0a1122;
    --surface:#ffffff; --surface-2:#f4f7fc; --surface-3:#e9eef7;
    --line:rgba(15,30,60,.12); --line-2:rgba(15,30,60,.2);
    --text:#0f1b30; --muted:#54627d; --faint:#7c89a1;
    --shadow:0 18px 44px -22px rgba(20,40,80,.4);
    --shadow-sm:0 6px 16px -10px rgba(20,40,80,.35);
    color-scheme:light;
  }
}
/* явные переключатели темы перекрывают media в обе стороны */
:root[data-theme="dark"]{
  --bg:#070b14; --bg-2:#0b1120; --surface:#111a2e; --surface-2:#16223c; --surface-3:#1d2c4c;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --text:#eaf0fb; --muted:#93a2c0; --faint:#6a7998;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75); --shadow-sm:0 6px 18px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef1f7; --bg-2:#e6ebf4; --surface:#ffffff; --surface-2:#f4f7fc; --surface-3:#e9eef7;
  --line:rgba(15,30,60,.12); --line-2:rgba(15,30,60,.2);
  --text:#0f1b30; --muted:#54627d; --faint:#7c89a1;
  --shadow:0 18px 44px -22px rgba(20,40,80,.4); --shadow-sm:0 6px 16px -10px rgba(20,40,80,.35);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(47,123,255,.18), transparent 60%),
    radial-gradient(1200px 700px at 85% -10%, rgba(18,194,106,.16), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100dvh; overflow-x:hidden;
}
.font-display{font-family:'Oswald',system-ui,sans-serif}
h1,h2,h3,.display{font-family:'Oswald',system-ui,sans-serif;font-weight:700;line-height:1.02;margin:0;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;font-family:'Oswald',system-ui,sans-serif}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}

/* ===== layout shell ===== */
.wrap{max-width:960px;margin:0 auto;padding:0 16px 120px}
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 78%, transparent);
  border-bottom:1px solid var(--line);
}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,208,122,.5)}70%{box-shadow:0 0 0 8px rgba(37,208,122,0)}100%{box-shadow:0 0 0 0 rgba(37,208,122,0)}}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font-weight:600;font-size:15px;transition:transform .06s,filter .15s,background .15s}

.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ===== cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);font-family:'Oswald';font-weight:600}
.section-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}

/* ===== POSTER ===== */
.poster{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow);background:var(--arena);isolation:isolate}

  background:
    radial-gradient(60% 90% at 22% 60%, rgba(47,123,255,.55), transparent 60%),

  background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(120% 90% at 50% 30%,#000,transparent 75%)}

.poster-in{position:relative;z-index:2;padding:22px 18px 20px}
.poster-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bo-badge{font-family:'Oswald';font-weight:700;font-size:clamp(30px,9vw,58px);letter-spacing:.02em;line-height:.9;
  background:linear-gradient(180deg,#fff6d6,var(--gold) 55%,#c98a00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.4)) drop-shadow(0 0 22px rgba(255,204,63,.35))}
.bo-sub{font-family:'Oswald';font-weight:600;letter-spacing:.34em;font-size:12px;text-transform:uppercase;color:#0c1220;background:linear-gradient(90deg,var(--gold),var(--gold-2));padding:4px 12px;border-radius:6px}
.sport-tag{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-family:'Oswald';font-weight:600}

.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:16px}
.player{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.player .ava{width:clamp(74px,22vw,120px);height:clamp(74px,22vw,120px);border-radius:50%;display:grid;place-items:center;font-family:'Oswald';font-weight:700;font-size:clamp(30px,9vw,52px);color:#fff;position:relative;border:3px solid rgba(255,255,255,.28)}
.player.a .ava{background:radial-gradient(120% 120% at 30% 20%,var(--blue-2),var(--blue) 45%,var(--blue-deep));box-shadow:0 0 34px -4px var(--blue),inset 0 0 22px rgba(0,0,0,.35)}
.player.b .ava{background:radial-gradient(120% 120% at 70% 20%,var(--green-2),var(--green) 45%,var(--green-deep));box-shadow:0 0 34px -4px var(--green),inset 0 0 22px rgba(0,0,0,.35)}
.player .pname{font-family:'Oswald';font-weight:700;text-transform:uppercase;font-size:clamp(20px,6vw,34px);line-height:.95;letter-spacing:.02em}
.player.a .pname{color:#dfe9ff}
.player.b .pname{color:#d6ffe9}
.player .psub{font-family:'Oswald';font-weight:600;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.player .odd-mini{margin-top:2px;font-family:'Oswald';font-weight:700;font-size:20px}
.player.a .odd-mini{color:var(--blue-2)} .player.b .odd-mini{color:var(--green-2)}
.vs-badge{display:flex;flex-direction:column;align-items:center;gap:10px}
.vs-badge .versus{font-family:'Oswald';font-weight:700;font-style:italic;font-size:clamp(24px,7vw,40px);letter-spacing:.02em;color:#fff;text-shadow:0 0 18px rgba(55,224,255,.5)}
.vs-badge .fire{font-size:20px;filter:drop-shadow(0 0 10px rgba(255,120,40,.7))}
.meta-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px;color:#cdd8ef}
.meta-row .m{display:flex;flex-direction:column;align-items:center;gap:2px}
.meta-row .m b{font-family:'Oswald';font-weight:600;font-size:16px;letter-spacing:.04em}
.meta-row .m span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ===== stat strip ===== */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;position:relative;overflow:hidden}
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-family:'Oswald';font-weight:600}
.stat .v{font-family:'Oswald';font-weight:700;font-size:clamp(18px,5vw,26px);margin-top:3px;font-variant-numeric:tabular-nums}
.stat.accent .v{color:var(--gold)}
.stat .v small{font-size:.55em;color:var(--muted);font-weight:600}
@media(max-width:560px){.stat-strip{grid-template-columns:repeat(2,1fr)}}

/* ===== markets ===== */
.market{margin-top:14px}
.market-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.market-head .mt{font-family:'Oswald';font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px}
.market-head .badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.sel-grid{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
.sel-grid.cols-1{grid-template-columns:1fr}
.sel-grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.sel-grid.cols-4{grid-template-columns:repeat(2,1fr)}}
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);transition:.12s;text-align:left;width:100%}
.sel:hover{border-color:var(--line-2);background:var(--surface-3)}
.sel .lbl{font-weight:600;font-size:14px}
.sel .odd{font-family:'Oswald';font-weight:700;font-size:19px;color:var(--cyan);font-variant-numeric:tabular-nums}
.sel[data-side="a"] .odd{color:var(--blue-2)} .sel[data-side="b"] .odd{color:var(--green-2)}
.sel.picked{border-color:var(--gold);background:rgba(255,204,63,.12);box-shadow:0 0 0 1px var(--gold) inset}
.sel.win{border-color:var(--win);background:rgba(37,208,122,.12)}
.sel.dim{opacity:.5}
.odd-trend{font-size:10px;margin-left:6px}
.odd-trend.up{color:var(--win)} .odd-trend.down{color:var(--lose)}

/* ===== forms ===== */
label.field{display:block;margin:12px 0}
label.field .cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;font-family:'Oswald';font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:var(--ring)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.hint{font-size:12px;color:var(--faint);margin-top:6px}

.toggle button.on{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow-sm)}

.slip-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.slip-item .odd{font-family:'Oswald';font-weight:700;color:var(--cyan);width:46px;text-align:right}
.slip-item .rm{color:var(--lose);background:none;border:none;font-size:18px;line-height:1}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}

tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--win);font-weight:700} .neg{color:var(--lose);font-weight:700}
.rank{font-family:'Oswald';font-weight:700;color:var(--gold);width:34px}
.medal{font-size:16px}

/* ===== bottom nav ===== */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.botnav-in{display:flex;gap:2px;max-width:520px;width:100%}

.botnav button svg{width:22px;height:22px}
.botnav button.on{color:var(--cyan)}
.botnav button.on svg{filter:drop-shadow(0 0 8px rgba(55,224,255,.6))}
.botnav button .admin-dot{position:absolute}

.modal-back{position:fixed;inset:0;z-index:60;background:rgba(3,6,14,.66);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px}
.modal h3{font-size:20px;text-transform:uppercase;margin-bottom:4px}
.modal .close{position:absolute}
.qr-box{background:#fff;padding:14px;border-radius:14px;display:grid;place-items:center}
.qr-box img,.qr-box canvas{width:100%;height:auto;image-rendering:pixelated}
.code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:120px;overflow:auto}

/* misc */
.empty{text-align:center;padding:40px 16px;color:var(--faint)}
.empty .big{font-size:40px;margin-bottom:8px}
.badge-tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid-2{grid-template-columns:1fr}}
.disclaimer{font-size:11px;color:var(--faint);text-align:center;line-height:1.6;margin:22px 6px 0;border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--surface-3);border:1px solid var(--line-2);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:.25s;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip b{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      var bytes = [];

        if (c < 128) {
          bytes.push(c);

/* Возвращает актуальный кэф выбора в зависимости от режима матча. */
const DYN_ANCHOR = 200; // «инерция» стартовых кэфов (в виртуальных единицах)

  const map = {};

  S.bets.forEach(bet => bet.picks.forEach(p => {
    if (p.marketId !== marketId) return;
    map[p.selectionId] = (map[p.selectionId] || 0) + (Number(p.stake) || 0);
    pool += (Number(p.stake) || 0);

function dynamicOdds(market) {
  const comm = (S.match.commissionPct || 0) / 100;
  const { map } = marketStakes(market.id);
  const eff = {}; let total = 0;
  market.selections.forEach(sel => {
    const base = 1 / Math.max(1.01, sel.odd || 2);   // базовая «вероятность» из постера
    eff[sel.id] = base * DYN_ANCHOR + (map[sel.id] || 0);

  if (!m || !sel) return pick.oddAtBet || 1;
  return S.match.oddsMode === 'dynamic' ? dynamicOdds(m)[sel.id] : (pick.oddAtBet || sel.odd);

/* ============ VIEW: MATCH ============ */
function viewMatch() {
  const m = S.match;

    '<div class="section-title">' + icon('chart') + ' Рынки и коэффициенты <span class="line"></span>' +

function poster(m) {

  const oddA = winMk ? fmtOdd(oddOf(winMk, winMk.selections[0])) : '';
  const oddB = winMk ? fmtOdd(oddOf(winMk, winMk.selections[1])) : '';
  const av = (p) => esc((p.name || '?').trim().charAt(0).toUpperCase());
  return '' +
  '<div class="poster"><div class="bg"></div><div class="grid-fx"></div><div class="split"></div><div class="poster-in">' +
    '<div class="poster-top">' +
      '<span class="sport-tag">' + icon('paddle') + ' ' + esc(m.sport) + '</span>' +
      '<div class="bo-badge">' + esc(m.format) + '</div>' +
      '<div class="bo-sub">до ' + m.winsTarget + ' побед</div>' +
    '</div>' +
    '<div class="vs-row">' +
      '<div class="player a">' +
        '<div class="ava">' + av(m.playerA) + '</div>' +
        '<div class="pname">' + esc(m.playerA.name) + '</div>' +
        '<div class="psub">' + esc(m.playerA.sub || '') + '</div>' +

      '<div class="vs-badge"><span class="fire">' + IC.fire + '</span><span class="versus">VERSUS</span><span class="fire">' + IC.fire + '</span></div>' +
      '<div class="player b">' +
        '<div class="ava">' + av(m.playerB) + '</div>' +
        '<div class="pname">' + esc(m.playerB.name) + '</div>' +
        '<div class="psub">' + esc(m.playerB.sub || '') + '</div>' +
        (oddB ? '<div class="odd-mini">Кэф ' + oddB + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="meta-row">' +
      '<div class="m"><b>' + esc(dateStr) + '</b><span>Начало</span></div>' +
      '<div class="m"><b>' + esc(m.venueText || '—') + '</b><span>Площадка</span></div>' +
      '<div class="m"><b>Комиссия ' + m.commissionPct + '%</b><span>с выигрыша</span></div>' +
    '</div>' +

      '<button class="btn gold sm" data-act="open-invite">' + icon('qr') + ' Пригласить / QR</button>' +
      (S.match.status === 'open' ? '<button class="btn primary sm" data-act="go" data-view="bet">' + icon('bet') + ' Сделать прогноз</button>' : '') +

function statStrip() {
  const bank = totalBank();
  return '<div class="stat-strip">' +
    stat('Ставок', fmtMoney(betsCount()), false) +
    stat('Банк (усл.)', fmtMoney(bank), true) +
    stat('Участников', fmtMoney(participants().length), false) +
    '<div class="stat" id="countdown-stat"><div class="k">До начала</div><div class="v num" id="countdown">—</div></div>' +
  '</div>';
}
function stat(k, v, accent) {
  return '<div class="stat ' + (accent ? 'accent' : '') + '"><div class="k">' + esc(k) + '</div><div class="v num">' + v + '</div></div>';
}

/* ---- market block ---- */
function marketBlock(mk) {
  const res = S.match.result && S.match.result.outcomes ? S.match.result.outcomes[mk.id] : null;
  const cols = mk.cols === 4 ? 'cols-4' : (mk.selections.length <= 2 ? 'cols-1' : '');
  const dyn = S.match.oddsMode === 'dynamic' ? dynamicOdds(mk) : null;
  const sels = mk.selections.map(sel => {
    const inSlip = UI.slip.some(p => p.marketId === mk.id && p.selectionId === sel.id);
    const odd = dyn ? dyn[sel.id] : sel.odd;
    const isWin = res && res === sel.id;
    const dim = res && res !== sel.id;
    const cls = ['sel', inSlip ? 'picked' : '', isWin ? 'win' : '', dim ? 'dim' : ''].join(' ');
    const clickable = S.match.status === 'open';
    return '<button class="' + cls + '" ' + (sel.side ? 'data-side="' + sel.side + '"' : '') +
      (clickable ? ' data-act="pick" data-market="' + mk.id + '" data-sel="' + sel.id + '"' : ' disabled') + '>' +
      '<span class="lbl">' + esc(sel.label) + (isWin ? ' ' + icon('check') : '') + '</span>' +
      '<span class="odd">' + fmtOdd(odd) + '</span></button>';
  }).join('');
  return '<div class="market card pad">' +
    '<div class="market-head"><span class="mt">' + esc(mk.name) + '</span>' +
      '<span class="badge">' + (mk.kind === 'winner' ? 'Победитель' : mk.kind === 'score' ? 'Точный счёт' : 'Спецставка') + '</span></div>' +
    '<div class="sel-grid ' + cols + '">' + sels + '</div></div>';
}

/* ---- slip bar (сводка выбранного, кнопка перейти) ---- */
function slipBar() {
  if (!UI.slip.length || UI.view !== 'match') return '';
  return '<div class="card pad" style="position:sticky;bottom:78px;margin-top:14px;border-color:var(--gold)">' +
    '<div class="row" style="align-items:center"><div><b>' + UI.slip.length + '</b> исх. в прогнозе</div>' +
    '<button class="btn gold" data-act="go" data-view="bet">Оформить прогноз →</button></div></div>';
}

function disclaimer() {
  return '<div class="disclaimer">HomeMade Betting — сервис для <b>домашних дружеских</b> соревнований. ' +
    'Это <b>не букмекерская контора</b>: сервис не принимает и не хранит денежные средства, не производит выплат и не является ' +
    'организатором азартных игр. Все суммы и коэффициенты — виртуальные и служат только для автоматического расчёта результатов между друзьями.</div>';
}

/* ============ HOMEMADE BETTING — views (bet / me / leaders / history) ============ */

function selInfo(marketId, selectionId) {
  const m = S.match.markets.find(x => x.id === marketId);
  const sel = m && m.selections.find(x => x.id === selectionId);
  return { m, sel };
}

/* ============ VIEW: BET (сделать / изменить прогноз) ============ */
function viewBet() {
  const open = S.match.status === 'open';
  if (!open) {
    return banner('Приём прогнозов закрыт', 'Администратор закрыл приём. Загляни в «Рейтинг», чтобы увидеть расчёт.') +
      leadersPreview();
  }
  let html = '<div class="section-title">' + icon('bet') + ' Ваш прогноз <span class="line"></span></div>';
  html += '<div class="card pad">' +
    '<label class="field"><span class="cap">Ваше имя</span>' +
    '<input id="bet-name" placeholder="Например, Андрей" value="' + esc(UI.name) + '" autocomplete="off"></label>' +
    '<div class="row"><button class="btn ghost sm" data-act="load-my-bet">' + icon('edit') + ' Загрузить мой прогноз для правки</button></div>' +
  '</div>';

  if (!UI.slip.length) {
    html += '<div class="empty"><div class="big">🎯</div>Пока ничего не выбрано.<br>Открой вкладку «Матч» и нажми на исходы.<br><br>' +
      '<button class="btn primary" data-act="go" data-view="match">К рынкам матча</button></div>';
    return html;
  }

  let total = 0, potential = 0;
  const rows = UI.slip.map((p, i) => {
    const { m, sel } = selInfo(p.marketId, p.selectionId);
    if (!m || !sel) return '';
    const odd = oddOf(m, sel);
    const stake = Number(p.stake) || 0;
    total += stake; potential += stake * odd;
    return '<div class="slip-item">' +
      '<div class="info"><b>' + esc(sel.label) + '</b><span>' + esc(m.name) + '</span></div>' +
      '<span class="odd">' + fmtOdd(odd) + '</span>' +
      '<span class="stk"><input type="number" min="0" step="10" inputmode="numeric" value="' + stake + '" data-act="slip-stake" data-idx="' + i + '"></span>' +
      '<button class="rm" data-act="slip-remove" data-idx="' + i + '" aria-label="Убрать">' + icon('close') + '</button>' +
    '</div>';
  }).join('');

  html += '<div class="card pad" style="margin-top:12px">' + rows +
    '<div class="row" style="margin-top:12px">' +
      ['100', '250', '500', '1000'].map(v => '<button class="btn ghost sm" data-act="quick-stake" data-val="' + v + '">' + v + '</button>').join('') +
    '</div>' +
    '<div class="row" style="margin-top:14px;align-items:center">' +
      '<div><div class="hint">Сумма прогноза</div><div class="num" style="font-size:22px;font-weight:700;font-family:Oswald">' + fmtMoney(total) + '</div></div>' +
      '<div style="text-align:right"><div class="hint">Возможный возврат</div><div class="num" style="font-size:22px;font-weight:700;font-family:Oswald;color:var(--gold)">' + fmtMoney(potential) + '</div></div>' +
    '</div>' +
  '</div>';

  html += '<div class="row" style="margin-top:14px">' +
    '<button class="btn ghost" data-act="go" data-view="match">+ Ещё исходы</button>' +
    '<button class="btn green" data-act="submit-bet">' + icon('check') + ' Сохранить прогноз</button>' +
  '</div>';
  html += '<p class="hint" style="text-align:center;margin-top:10px">Суммы виртуальные — только для расчёта. Прогноз можно менять, пока приём открыт.</p>';
  return html;
}

/* ============ VIEW: ME (мои прогнозы) ============ */
function viewMe() {
  let html = '<div class="section-title">' + icon('users') + ' Мои прогнозы <span class="line"></span></div>';
  html += '<div class="card pad"><label class="field"><span class="cap">Имя участника</span>' +
    '<input id="me-name" placeholder="Введите имя" value="' + esc(UI.name) + '" data-act="me-name"></label></div>';
  const bet = findBet(UI.name);
  if (!UI.name) { html += '<p class="empty">Введите имя, чтобы увидеть свой прогноз.</p>'; return html; }
  if (!bet) {
    html += '<div class="empty"><div class="big">🤔</div>Прогноза с именем «' + esc(UI.name) + '» пока нет.<br><br>' +
      (S.match.status === 'open' ? '<button class="btn primary" data-act="go" data-view="bet">Сделать прогноз</button>' : '') + '</div>';
    return html;
  }
  html += betCoupon(bet, true);
  return html;
}

function betCoupon(bet, mine) {
  const sum = betSummary(bet);
  const finished = S.match.status === 'finished';
  const rows = bet.picks.map(p => {
    const { m, sel } = selInfo(p.marketId, p.selectionId);
    if (!m || !sel) return '';
    const r = pickResult(p);
    const odd = r.settled ? r.odd : oddOf(m, sel);
    let tag = '<span class="badge-tag">в игре</span>';
    if (r.settled) tag = r.win
      ? '<span class="pos">выигрыш +' + fmtMoney(p.stake * (odd - 1)) + '</span>'
      : '<span class="neg">−' + fmtMoney(p.stake) + '</span>';
    return '<tr><td>' + esc(sel.label) + '<div class="hint">' + esc(m.name) + '</div></td>' +
      '<td class="num">' + fmtOdd(odd) + '</td><td class="num">' + fmtMoney(p.stake) + '</td><td class="num">' + tag + '</td></tr>';
  }).join('');
  let head = '<div class="market-head"><span class="mt">' + esc(bet.participant) + '</span>';
  if (finished) head += '<span class="' + (sum.profit >= 0 ? 'pos' : 'neg') + '" style="font-family:Oswald;font-size:20px">' + fmtSigned(sum.profit) + '</span>';
  else head += '<span class="chip">Ставка: <b>' + fmtMoney(sum.staked) + '</b></span>';
  head += '</div>';
  let html = '<div class="card pad">' + head +
    '<div class="tbl-wrap" style="margin-top:8px;border:none"><table><thead><tr><th>Исход</th><th class="num">Кэф</th><th class="num">Сумма</th><th class="num">Итог</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>';
  if (mine && S.match.status === 'open') {
    html += '<div class="row" style="margin-top:12px">' +
      '<button class="btn ghost sm" data-act="load-my-bet">' + icon('edit') + ' Изменить</button>' +
      '<button class="btn ghost sm" data-act="my-ticket">' + icon('share') + ' Код для админа</button>' +
      '<button class="btn danger sm" data-act="del-my-bet">Удалить</button>' +
    '</div>';
  }
  if (finished) {
    html += '<div class="row" style="margin-top:6px"><div class="chip">Угадано: <b>' + sum.won + ' / ' + sum.settled + '</b></div>' +
      '<div class="chip">Возврат: <b>' + fmtMoney(sum.returned) + '</b></div></div>';
  }
  html += '</div>';
  return html;
}

/* ============ VIEW: LEADERS (рейтинг) ============ */
function viewLeaders() {
  let html = '<div class="section-title">' + icon('trophy') + ' Рейтинг матча <span class="line"></span></div>';
  html += hallOfFame();
  if (S.match.status !== 'finished') {
    html += banner('Идёт приём / расчёт', 'Итоговая прибыль появится после ввода результата администратором. Пока — суммы в игре и популярность исходов.');
    html += leadersPreview() + popularityBlock();
    return html;
  }
  const lb = leaderboard();
  if (!lb.length) { html += '<p class="empty">Ставок не было.</p>'; return html; }
  html += '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Участник</th><th class="num">Ставка</th><th class="num">Возврат</th><th class="num">Точность</th><th class="num">Прибыль</th></tr></thead><tbody>' +
    lb.map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1);
      return '<tr><td class="rank">' + (typeof medal === 'string' && medal.length > 1 ? '<span class="medal">' + medal + '</span>' : medal) + '</td>' +
        '<td><b>' + esc(r.name) + '</b></td>' +
        '<td class="num">' + fmtMoney(r.staked) + '</td>' +
        '<td class="num">' + fmtMoney(r.returned) + '</td>' +
        '<td class="num">' + r.won + '/' + r.settled + '</td>' +
        '<td class="num ' + (r.profit >= 0 ? 'pos' : 'neg') + '">' + fmtSigned(r.profit) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  html += popularityBlock();
  return html;
}

function leadersPreview() {
  const lb = leaderboard();
  if (!lb.length) return '<p class="empty">Прогнозов пока нет.</p>';
  return '<div class="tbl-wrap"><table><thead><tr><th>Участник</th><th class="num">Исходов</th><th class="num">Сумма в игре</th></tr></thead><tbody>' +
    lb.map(r => '<tr><td><b>' + esc(r.name) + '</b></td><td class="num">' + r.picks + '</td><td class="num">' + fmtMoney(r.staked) + '</td></tr>').join('') +
    '</tbody></table></div>';
}

function popularityBlock() {
  const rows = [];
  S.match.markets.forEach(mk => {
    const { map, pool } = marketStakes(mk.id);
    if (pool <= 0) return;
    mk.selections.forEach(sel => {
      const st = map[sel.id] || 0;
      if (st > 0) rows.push({ name: mk.name, label: sel.label, st, pct: st / pool * 100 });
    });
  });
  if (!rows.length) return '';
  rows.sort((a, b) => b.st - a.st);
  return '<div class="section-title">' + icon('chart') + ' Популярность исходов <span class="line"></span></div>' +
    '<div class="card pad">' + rows.slice(0, 8).map(r =>
      '<div style="margin:8px 0"><div class="row" style="align-items:center"><div class="info" style="flex:1"><b>' + esc(r.label) + '</b> <span class="hint">' + esc(r.name) + '</span></div>' +
      '<div class="num" style="font-weight:700;font-family:Oswald">' + Math.round(r.pct) + '%</div></div>' +
      '<div style="height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin-top:4px"><div style="height:100%;width:' + r.pct.toFixed(1) + '%;background:linear-gradient(90deg,var(--blue),var(--green))"></div></div></div>').join('') +
    '</div>';
}

/* ============ VIEW: HISTORY ============ */
function viewHistory() {
  let html = '<div class="section-title">' + icon('history') + ' История матчей <span class="line"></span></div>';
  html += hallOfFame();
  if (!S.history.length) {
    html += '<div class="empty"><div class="big">📜</div>Сыгранных матчей пока нет.<br>Завершённые матчи попадают сюда из админ-панели.</div>';
    return html;
  }
  html += S.history.slice().reverse().map(h => {

    return '<div class="card pad" style="margin-top:12px">' +
      '<div class="market-head"><span class="mt">' + esc(h.title || (h.playerA + ' vs ' + h.playerB)) + '</span>' +
      '<span class="badge">' + esc(h.dateStr || '') + '</span></div>' +
      '<div class="row" style="margin-top:6px">' +
        '<div class="chip">Победитель: <b>' + esc(h.winner || '—') + '</b></div>' +
        (h.scoreText ? '<div class="chip">Счёт: <b>' + esc(h.scoreText) + '</b></div>' : '') +
        '<div class="chip">Банк: <b>' + fmtMoney(h.bank || 0) + '</b></div>' +
        '<div class="chip">Участников: <b>' + (h.participants || 0) + '</b></div>' +
      '</div>' +
      (top ? '<div class="row" style="margin-top:8px"><div class="chip">🥇 <b>' + esc(top.name) + '</b> ' + fmtSigned(top.profit) + '</div></div>' : '') +
    '</div>';
  }).join('');
  return html;
}

/* Зал славы — агрегат по истории (история побед участников). */
function hallOfFame() {
  const agg = {};
  const add = (name, profit, win) => {
    const k = name.toLowerCase();
    if (!agg[k]) agg[k] = { name, matches: 0, profit: 0, wins: 0 };
    agg[k].matches++; agg[k].profit += profit; if (win) agg[k].wins++;
  };
  S.history.forEach(h => {
    (h.leaderboard || []).forEach((r, i) => add(r.name, r.profit || 0, i === 0));
  });
  const list = Object.values(agg).sort((a, b) => b.wins - a.wins || b.profit - a.profit);
  if (!list.length) return '';
  return '<div class="card pad"><div class="market-head"><span class="mt">🏆 Зал славы</span>' +
    '<span class="badge">' + S.history.length + ' матч(ей)</span></div>' +
    '<div class="tbl-wrap" style="border:none;margin-top:6px"><table><thead><tr><th>Игрок</th><th class="num">Матчей</th><th class="num">Побед</th><th class="num">Σ прибыль</th></tr></thead><tbody>' +
    list.map(r => '<tr><td><b>' + esc(r.name) + '</b></td><td class="num">' + r.matches + '</td><td class="num">' + r.wins + '</td><td class="num ' + (r.profit >= 0 ? 'pos' : 'neg') + '">' + fmtSigned(r.profit) + '</td></tr>').join('') +
    '</tbody></table></div></div>';
}

function banner(title, text) {
  return '<div class="card pad" style="border-color:var(--line-2);margin-bottom:12px">' +
    '<b style="font-family:Oswald;font-size:18px;text-transform:uppercase">' + esc(title) + '</b>' +
    '<p class="hint" style="margin:6px 0 0">' + esc(text) + '</p></div>';
}

/* ============ EXPORT ============ */
function downloadFile(filename, text, mime) {
  try {
    if (window.claude && window.claude.downloads && typeof window.claude.downloads.save === 'function') {
      window.claude.downloads.save({ filename, data: text }); toast('Файл сохранён'); return;
    }
  } catch (e) {}
  try {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Файл выгружен');
  } catch (e) { toast('Не удалось выгрузить'); }
}
function exportJSON() { downloadFile('homemade-betting.json', JSON.stringify(S, null, 2), 'application/json'); }
function exportCSV() {
  const rows = [['Участник', 'Рынок', 'Исход', 'Кэф', 'Сумма', 'Результат', 'Прибыль']];
  S.bets.forEach(b => b.picks.forEach(p => {
    const { m, sel } = selInfo(p.marketId, p.selectionId);
    const r = pickResult(p);
    rows.push([b.participant, m ? m.name : p.marketId, sel ? sel.label : p.selectionId,
      fmtOdd(r.settled ? r.odd : oddOf(m, sel)), p.stake,
      r.settled ? (r.win ? 'Выигрыш' : 'Проигрыш') : 'В игре',
      r.settled ? Math.round(r.profit) : '']);
  }));
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  downloadFile('homemade-betting.csv', csv, 'text/csv;charset=utf-8');
}

/* ============ ACTIONS ============ */
function togglePick(marketId, selectionId) {
  const i = UI.slip.findIndex(p => p.marketId === marketId && p.selectionId === selectionId);
  if (i >= 0) UI.slip.splice(i, 1);
  else {
    // один исход на рынок
    UI.slip = UI.slip.filter(p => p.marketId !== marketId);
    UI.slip.push({ marketId, selectionId, stake: 100 });
    toast('Добавлено в прогноз');
  }
}
function submitBet() {
  const name = (getVal('#bet-name') || UI.name || '').trim();
  if (!name) { toast('Введите имя'); return; }
  if (!UI.slip.length) { toast('Выберите хотя бы один исход'); return; }
  const picks = UI.slip.filter(p => (Number(p.stake) || 0) > 0).map(p => {
    const { m, sel } = selInfo(p.marketId, p.selectionId);
    return { marketId: p.marketId, selectionId: p.selectionId, stake: Number(p.stake) || 0, oddAtBet: sel ? sel.odd : 1 };
  });
  if (!picks.length) { toast('Укажите суммы прогнозов'); return; }
  setName(name);
  const existing = findBet(name);
  if (existing) { existing.picks = picks; existing.editedAt = Date.now(); }
  else S.bets.push({ id: uid('bet'), participant: name, picks, createdAt: Date.now() });
  UI.slip = []; UI.editingBetId = null;
  saveState(); toast('Прогноз сохранён ✓'); go('me');
}
function loadMyBet() {
  const name = (getVal('#bet-name') || getVal('#me-name') || UI.name || '').trim();
  if (!name) { toast('Введите имя'); return; }
  const bet = findBet(name);
  if (!bet) { toast('Прогноз не найден'); return; }
  setName(name);
  UI.slip = bet.picks.map(p => ({ marketId: p.marketId, selectionId: p.selectionId, stake: p.stake }));
  go('bet');
}
function saveResult() {
  const outcomes = {};
  S.match.markets.forEach(mk => { const v = getVal('#res_' + mk.id); if (v) outcomes[mk.id] = v; });
  const scoreText = getVal('#res_score') || '';
  S.match.result = { outcomes, scoreText };
  S.match.status = 'finished';
  saveState(); closeModal(); toast('Матч рассчитан ✓'); go('leaders');
}
function newMatch() {
  if (!confirm('Текущий матч будет перенесён в историю, начнётся новый. Продолжить?')) return;
  if (S.match.status === 'finished' || S.bets.length) archiveCurrent();
  const fresh = seedState();
  fresh.match.playerA = { ...S.match.playerA };
  fresh.match.playerB = { ...S.match.playerB };
  fresh.match.oddsMode = S.match.oddsMode;
  fresh.match.commissionPct = S.match.commissionPct;
  fresh.match.markets = JSON.parse(JSON.stringify(S.match.markets)); // те же рынки
  fresh.match.result = null; fresh.match.status = 'open';
  S.match = fresh.match; S.bets = [];
  saveState(); toast('Новый матч создан'); go('match');
}
function archiveCurrent() {
  const winMk = S.match.markets.find(x => x.kind === 'winner');
  const winSel = winMk && S.match.result && S.match.result.outcomes ? winMk.selections.find(s => s.id === S.match.result.outcomes[winMk.id]) : null;
  const lb = leaderboard().map(r => ({ name: r.name, profit: Math.round(r.profit), won: r.won, settled: r.settled }));
  S.history.push({
    title: S.match.title, playerA: S.match.playerA.name, playerB: S.match.playerB.name,
    dateStr: new Date(S.match.dateISO).toLocaleDateString('ru-RU'),
    winner: winSel ? winSel.label : '—',
    scoreText: S.match.result ? S.match.result.scoreText : '',
    bank: totalBank(), participants: participants().length, leaderboard: lb
  });
}

/* ============ delegated events ============ */
function getVal(sel) { const el = $(sel); return el ? el.value : ''; }
function setName(n) { UI.name = n; localStorage.setItem('hmb_name', n); }

function onClick(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'go': go(d.view); break;
    case 'theme': toggleTheme(); break;
    case 'pick': togglePick(d.market, d.sel); render(); break;
    case 'quick-stake': UI.slip.forEach(p => p.stake = Number(d.val)); render(); break;
    case 'slip-remove': UI.slip.splice(Number(d.idx), 1); render(); break;
    case 'submit-bet': submitBet(); break;
    case 'load-my-bet': loadMyBet(); break;
    case 'my-ticket': { const b = findBet(UI.name); if (b) modalTicket(b); break; }
    case 'del-my-bet': { const b = findBet(UI.name); if (b && confirm('Удалить ваш прогноз?')) { S.bets = S.bets.filter(x => x !== b); saveState(); render(); } break; }
    case 'open-invite': modalInvite(); break;
    case 'open-import': modalImport(); break;
    case 'import-save': doImport(); break;
    case 'close-modal': closeModal(); break;
    case 'modal-backdrop': if (e.target === t) closeModal(); break;
    case 'copy': { const el = $('#' + d.copy); copyText(el ? (el.value || el.textContent) : ''); break; }
    case 'native-share': if (navigator.share) navigator.share({ title: 'HomeMade Betting', url: inviteURL() }).catch(() => {}); break;
    case 'admin-unlock': if (getVal('#admin-pin') === S.settings.adminPin) { UI.adminUnlocked = true; sessionStorage.setItem('hmb_admin', '1'); render(); } else toast('Неверный PIN'); break;
    case 'set-status': S.match.status = d.status; saveState(); render(); toast(d.status === 'open' ? 'Приём открыт' : 'Приём закрыт'); break;
    case 'set-mode': S.match.oddsMode = d.mode; saveState(); render(); break;
    case 'edit-match': modalMatchEditor(); break;
    case 'save-match': saveMatch(); break;
    case 'open-result': modalResult(); break;
    case 'save-result': saveResult(); break;
    case 'reopen': S.match.status = 'open'; S.match.result = null; saveState(); closeModal(); render(); break;
    case 'add-market': modalAddMarket(); break;
    case 'add-market-save': addMarket(); break;
    case 'del-market': if (confirm('Удалить рынок?')) { S.match.markets = S.match.markets.filter(m => m.id !== d.market); saveState(); render(); } break;
    case 'add-sel': addSel(d.market); break;
    case 'del-sel': delSel(d.market, d.sel); break;
    case 'del-bet': if (confirm('Удалить прогноз участника?')) { S.bets = S.bets.filter(b => b.id !== d.id); saveState(); render(); } break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'results-link': showLink('Ссылка на результаты', resultsURL()); break;
    case 'set-pin': modalSetPin(); break;
    case 'save-pin': S.settings.adminPin = getVal('#new-pin'); UI.adminUnlocked = true; sessionStorage.setItem('hmb_admin', '1'); saveState(); closeModal(); render(); toast('PIN обновлён'); break;
    case 'new-match': newMatch(); break;
  }
}
function onInput(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  if (a === 'slip-stake') { const i = Number(d.idx); if (UI.slip[i]) UI.slip[i].stake = Number(t.value) || 0; }
  else if (a === 'sel-odd') { const s = findSel(d.market, d.sel); if (s) { s.odd = Math.max(1.01, Number(t.value) || 1.01); saveState(); } }
  else if (a === 'sel-label') { const s = findSel(d.market, d.sel); if (s) { s.label = t.value; saveState(); } }
}
function onChange(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'me-name') { setName(t.value.trim()); render(); }
  else if (t.dataset.act === 'slip-stake') render();
}
function findSel(mid, sid) { const m = S.match.markets.find(x => x.id === mid); return m && m.selections.find(x => x.id === sid); }
function addSel(mid) { const m = S.match.markets.find(x => x.id === mid); if (m) { m.selections.push({ id: uid('sel'), label: 'Новый исход', odd: 2.00 }); saveState(); render(); } }
function delSel(mid, sid) { const m = S.match.markets.find(x => x.id === mid); if (m) { m.selections = m.selections.filter(s => s.id !== sid); saveState(); render(); } }
function addMarket() {
  const name = getVal('#nm_name').trim(); if (!name) { toast('Введите название'); return; }
  const kind = getVal('#nm_kind') || 'custom';
  S.match.markets.push({ id: uid('mk'), name, kind, selections: [] });
  saveState(); closeModal(); render();
}
function saveMatch() {
  const m = S.match;
  m.playerA.name = getVal('#e_pa') || m.playerA.name;
  m.playerB.name = getVal('#e_pb') || m.playerB.name;
  m.playerA.sub = getVal('#e_sa'); m.playerB.sub = getVal('#e_sb');
  m.sport = getVal('#e_sport') || m.sport;
  m.format = getVal('#e_fmt') || m.format;
  m.winsTarget = Number(getVal('#e_wins')) || m.winsTarget;
  m.venueText = getVal('#e_venue');
  m.commissionPct = clamp(Number(getVal('#e_comm')) || 0, 0, 50);
  const dv = getVal('#e_date'); if (dv) m.dateISO = new Date(dv).toISOString();
  saveState(); closeModal(); render(); toast('Матч обновлён');
}
function doImport() {
  const txt = getVal('#import-area') || '';
  let n = 0;
  txt.split(/\r?\n/).forEach(line => {
    line = line.trim(); if (!line) return;
    const code = line.startsWith('HMB1:') ? line.slice(5) : line;
    const obj = decObj(code);
    if (obj && obj.participant && Array.isArray(obj.picks)) {
      const ex = findBet(obj.participant);
      if (ex) ex.picks = obj.picks;
      else S.bets.push({ id: uid('bet'), participant: obj.participant, picks: obj.picks, createdAt: Date.now() });
      n++;
    }
  });
  saveState(); closeModal(); render(); toast(n ? ('Импортировано: ' + n) : 'Коды не распознаны');
}
function showLink(title, url) {
  openModal('<h3>' + esc(title) + '</h3><div class="code-box" id="share-link" style="margin:12px 0">' + esc(url) + '</div>' +
    '<button class="btn primary block" data-act="copy" data-copy="share-link">' + icon('copy') + ' Копировать</button>');
}

/* ============ theme ============ */
function themeIsDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const meta = $('#theme-color-meta'); if (meta) meta.setAttribute('content', themeIsDark() ? '#070b14' : '#eef1f7');
}
function toggleTheme() { S.settings.theme = themeIsDark() ? 'light' : 'dark'; saveState(); applyTheme(); renderChrome(); }

/* ============ countdown ============ */
function startCountdown() {
  setInterval(() => {
    const el = $('#countdown'); if (!el) return;
    let diff = new Date(S.match.dateISO).getTime() - Date.now();
    if (S.match.status === 'finished') { el.textContent = 'Финал'; return; }
    if (diff <= 0) { el.textContent = 'Идёт'; return; }
    const d = Math.floor(diff / 864e5); diff -= d * 864e5;
    const h = Math.floor(diff / 36e5); diff -= h * 36e5;
    const mi = Math.floor(diff / 6e4); diff -= mi * 6e4;
    const s = Math.floor(diff / 1e3);
    const p = (x) => String(x).padStart(2, '0');
    el.textContent = (d > 0 ? d + 'д ' : '') + p(h) + ':' + p(mi) + ':' + p(s);
  }, 1000);
}

/* ============ sharing on load (hash) ============ */
function handleHash() {
  const hash = location.hash || '';
  const clean = () => history.replaceState(null, '', location.pathname + location.search);
  if (hash.startsWith('#i=')) {
    const obj = decObj(hash.slice(3));
    if (obj && obj.match) {
      const incoming = obj.match;
      const isNew = !S.match || S.match.id !== incoming.id;
      if (isNew) {
        if (!S.bets.length || confirm('Открыть присланный матч? Текущие локальные прогнозы будут заменены.')) {
          S.match = incoming; S.bets = []; saveState();
        }
      }
    }
    clean();
  } else if (hash.startsWith('#r=')) {
    const obj = decObj(hash.slice(3));
    if (obj && obj.match) {
      if (!S.bets.length || S.match.id === obj.match.id || confirm('Показать присланные результаты? Локальные данные будут заменены.')) {
        S.match = obj.match; S.bets = obj.bets || []; saveState(); UI.view = 'leaders';
      }
    }
    clean();
  }
}

/* ============ PWA ============ */
function injectPWA() {
  const head = document.head;
  const add = (tag, attrs) => { const e = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); head.appendChild(e); return e; };
  if (!$('meta[name="viewport"]')) add('meta', { name: 'viewport', content: 'width=device-width,initial-scale=1,viewport-fit=cover' });
  const tc = add('meta', { name: 'theme-color', content: '#070b14' }); tc.id = 'theme-color-meta';
  add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });
  add('meta', { name: 'apple-mobile-web-app-title', content: 'HomeMade Betting' });
  const iconSVG = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0a1122"/><circle cx="256" cy="256" r="150" fill="none" stroke="#37e0ff" stroke-width="18"/><path d="M256 106v300M106 256h300" stroke="#37e0ff" stroke-width="10" opacity=".5"/><text x="256" y="300" font-family="Arial" font-size="150" font-weight="bold" fill="#ffcc3f" text-anchor="middle">HB</text></svg>');
  add('link', { rel: 'apple-touch-icon', href: iconSVG });
  add('link', { rel: 'icon', href: iconSVG });
  if (!$('link[rel="manifest"]')) try {
    const manifest = {
      name: 'HomeMade Betting', short_name: 'HMB', display: 'standalone',
      background_color: '#070b14', theme_color: '#070b14', start_url: '.', scope: '.',
      description: 'Домашние дружеские матчи и прогнозы (виртуальные).',
      icons: [{ src: iconSVG, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    add('link', { rel: 'manifest', href: URL.createObjectURL(blob) });
  } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

/* ============ routing / render ============ */
function go(view) { UI.view = view; if (view !== 'match') UI.slip = UI.slip; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function render() {
  renderChrome();
  let html = '';
  switch (UI.view) {
    case 'bet': html = viewBet(); break;
    case 'leaders': html = viewLeaders(); break;
    case 'history': html = viewHistory(); break;
    case 'admin': html = viewAdmin(); break;
    case 'me': html = viewMe(); break;
    default: html = viewMatch();
  }
  $('#view').innerHTML = html;
}

/* ============ init ============ */
function init() {
  injectPWA();
  handleHash();
  applyTheme();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  startCountdown();
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
